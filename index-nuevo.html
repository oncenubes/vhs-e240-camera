<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>VHS E-240 — Prototipo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#08090b;--panel:#111317;--line:#292c32;--muted:#858995;--white:#f4f4f1;--red:#ff424b;--orange:#ff9d46}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#1a1d23 0%,var(--bg) 55%);color:var(--white);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.app{max-width:820px;margin:0 auto;padding:env(safe-area-inset-top,12px) 18px 24px}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.brand-mark{font-size:20px;font-weight:700;letter-spacing:-2px;border:2px solid #eee;padding:4px 6px;box-shadow:3px 3px 0 #f49a43}.brand strong{display:block;font-size:14px;letter-spacing:2px}.brand small{display:block;color:var(--muted);font:9px 'DM Mono',monospace;letter-spacing:1.5px;margin-top:4px}.icon-btn{border:1px solid #363941;background:#17191e;color:white;border-radius:50%;width:42px;height:42px;font-size:24px}.view-wrap{margin-top:6px}.viewfinder{position:relative;width:100%;aspect-ratio:4/3;max-height:62vh;background:#020304;overflow:hidden;border:1px solid #393b40;border-radius:15px;box-shadow:0 15px 50px #0009}video{display:none}canvas{width:100%;height:100%;display:block;object-fit:cover}.view-overlay{position:absolute;inset:0;pointer-events:none;padding:14px 14px 12px;display:flex;flex-direction:column;justify-content:space-between;font:11px 'DM Mono',monospace;letter-spacing:1px;text-shadow:0 1px 4px #000}.view-top,.view-bottom{display:flex;justify-content:space-between;align-items:center}.view-bottom{font-size:12px}.view-bottom span:first-child{display:none;color:#ffb96f}#recBadge{display:flex;align-items:center;gap:6px;opacity:.35}#recBadge i{display:block;width:7px;height:7px;border-radius:50%;background:var(--red)}#recBadge.live{opacity:1}#recBadge.live i{animation:blink 1s infinite}@keyframes blink{50%{opacity:.15}}.permission{position:absolute;inset:0;background:linear-gradient(140deg,#11151bdd,#050608f2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.permission.hidden{display:none}.camera-symbol{font-size:35px;color:var(--orange);margin-bottom:10px}.permission strong{font-size:18px}.permission p{font-size:12px;color:#a8abb3;max-width:240px;line-height:1.5}.primary{margin-top:10px;border:0;border-radius:5px;background:var(--orange);color:#17100a;font-weight:700;font-size:11px;letter-spacing:1px;padding:13px 18px}.statusline{display:flex;justify-content:space-between;color:#9397a1;font:10px 'DM Mono',monospace;letter-spacing:1px;padding:10px 2px 0}.controls{margin-top:18px;background:linear-gradient(145deg,#15171c,#0d0f12);border:1px solid #252830;border-radius:15px;padding:16px}.main-controls{display:flex;align-items:center;justify-content:space-around}.round-btn{width:56px;height:56px;border:1px solid #343740;border-radius:50%;background:#1c1f25;color:#ddd;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.round-btn small{font:8px 'DM Mono',monospace;letter-spacing:.5px;color:#a6a9b1}.record-btn{width:76px;height:76px;border:1px solid #9d3439;border-radius:50%;background:#291518;display:grid;place-items:center;box-shadow:0 0 0 5px #242126,0 0 25px #ff354022}.record-btn span{width:46px;height:46px;border-radius:50%;background:var(--red);box-shadow:inset 0 2px 5px #ffb1b1,0 3px 12px #ff283344;transition:.2s}.record-btn.recording span{border-radius:7px;width:28px;height:28px}.record-label{text-align:center;font:9px 'DM Mono',monospace;letter-spacing:1.5px;color:#a4a7b0;margin:12px 0 20px}.settings{border-top:1px solid #2b2e35;padding-top:15px}.setting-head{display:flex;justify-content:space-between;color:#aeb1b9;font:10px 'DM Mono',monospace;letter-spacing:1px;margin:0 0 9px}.setting-head strong{color:var(--orange)}input[type=range]{width:100%;accent-color:var(--orange);margin:0 0 18px}.preset-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.preset{padding:10px 3px;background:#191b20;color:#9296a0;border:1px solid #30333a;border-radius:5px;font:9px 'DM Mono',monospace}.preset.active{border-color:var(--orange);color:#ffd3a6;background:#292018}.toggles{display:flex;justify-content:space-between;gap:8px;margin-top:17px;flex-wrap:wrap}.toggles label{font:9px 'DM Mono',monospace;letter-spacing:.5px;color:#b9bbc2;display:flex;align-items:center;gap:6px}.toggles input{accent-color:var(--orange)}footer{padding:17px 2px 0;color:#555963;font:9px 'DM Mono',monospace;letter-spacing:1px;display:flex;justify-content:space-between}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#f4f0e9;color:#151515;border-radius:8px;padding:11px 16px;font-size:12px;box-shadow:0 5px 25px #0008;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:10}#toast.show{opacity:1}@media(min-width:700px){.app{padding-top:22px}.viewfinder{aspect-ratio:16/10;max-height:none}.controls{padding:20px 24px}}@media(max-width:380px){.app{padding-left:11px;padding-right:11px}.controls{padding:13px}.preset{font-size:8px}.toggles label{font-size:8px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><span class="brand-mark">VHS</span><div><strong>E-240</strong><small>ANALOG VIDEO SYSTEM</small></div></div><button id="flipBtn" class="icon-btn" title="Cambiar cámara" aria-label="Cambiar cámara">↻</button></header>
<section class="view-wrap"><div class="viewfinder"><video id="sourceVideo" autoplay playsinline muted></video><canvas id="outputCanvas"></canvas><div class="view-overlay"><div class="view-top"><span id="recBadge"><i></i> REC</span><span>▰▰▰▱</span></div><div class="center-cross" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:16px monospace;color:#fff8">+</div><div class="view-bottom"><span id="dateStamp"></span><span>SP</span></div></div><div id="permissionMessage" class="permission"><div class="camera-symbol">▣</div><strong>Tu cinta está esperando</strong><p>Activa la cámara para comenzar a grabar.</p><button id="startBtn" class="primary">ENCENDER CÁMARA</button></div></div><div class="statusline"><span id="statusText">CAM: STANDBY</span><span id="timer">00:00:00</span><span>HQ / VHS</span></div></section>
<section class="controls"><div class="main-controls"><button id="galleryBtn" class="round-btn" title="Abrir videos guardados">▧<small>ARCHIVO</small></button><button id="recordBtn" class="record-btn" aria-label="Grabar"><span></span></button><button id="snapshotBtn" class="round-btn" title="Guardar fotograma">◉<small>FOTO</small></button></div><div class="record-label" id="recordLabel">PULSA PARA GRABAR</div><div class="settings"><div class="setting-head"><span>EFECTO VHS</span><strong id="strengthLabel">70%</strong></div><input id="strength" type="range" min="0" max="100" value="70"><div class="setting-head"><span>ESTILO DE CINTA</span></div><div class="preset-row"><button class="preset active" data-preset="classic">E-240</button><button class="preset" data-preset="washed">HOME VIDEO</button><button class="preset" data-preset="noir">NIGHT TAPE</button><button class="preset" data-preset="clean">CAMCORDER</button></div><div class="toggles"><label><input id="dateToggle" type="checkbox" checked> FECHA</label><label><input id="linesToggle" type="checkbox" checked> SCANLINES</label><label><input id="noiseToggle" type="checkbox" checked> RUIDO</label></div></div></section><footer>PROTOTIPO LOCAL · VHS CAMERA LAB <span>v0.2</span></footer>
</main><div id="toast" role="status"></div>
<script>
(()=>{
'use strict';
const video=document.querySelector('#sourceVideo'),canvas=document.querySelector('#outputCanvas'),ctx=canvas.getContext('2d',{alpha:false}),permission=document.querySelector('#permissionMessage'),startBtn=document.querySelector('#startBtn'),recordBtn=document.querySelector('#recordBtn'),statusText=document.querySelector('#statusText'),timer=document.querySelector('#timer'),recBadge=document.querySelector('#recBadge'),strength=document.querySelector('#strength'),strengthLabel=document.querySelector('#strengthLabel'),dateToggle=document.querySelector('#dateToggle'),linesToggle=document.querySelector('#linesToggle'),noiseToggle=document.querySelector('#noiseToggle'),recordLabel=document.querySelector('#recordLabel');
let stream=null,recorder=null,chunks=[],recording=false,startedAt=0,timerHandle=null,facing='environment',preset='classic',raf=0,noiseCanvas=document.createElement('canvas'),noiseCtx;
noiseCanvas.width=320;noiseCanvas.height=240;noiseCtx=noiseCanvas.getContext('2d');
const presets={classic:{sat:1.42,contrast:1.16,brightness:1.02,tint:'rgba(255,105,36,.10)'},washed:{sat:.76,contrast:.88,brightness:1.13,tint:'rgba(255,211,151,.15)'},noir:{sat:.48,contrast:1.34,brightness:.78,tint:'rgba(54,76,111,.18)'},clean:{sat:1.05,contrast:1.03,brightness:1,tint:'rgba(255,255,255,.01)'}};
const pad=n=>String(n).padStart(2,'0');
function dateText(){const d=new Date();return `${['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()]}. ${pad(d.getDate())} ${d.getFullYear()}`}
function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2800)}
async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Este navegador no permite acceder a la cámara. Abre el sitio mediante HTTPS en Safari.');if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:true,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:960},frameRate:{ideal:30,max:30}}});video.srcObject=stream;await video.play();permission.classList.add('hidden');statusText.textContent='CAM: ACTIVE';canvas.width=video.videoWidth||1280;canvas.height=video.videoHeight||960;cancelAnimationFrame(raf);render();toast('Cámara activada. Ajusta el efecto y pulsa REC.')}catch(err){toast(err.message||'No se pudo abrir la cámara. Revisa los permisos del navegador.')}}
function makeNoise(){const img=noiseCtx.createImageData(noiseCanvas.width,noiseCanvas.height);for(let i=0;i<img.data.length;i+=4){const v=Math.random()*255;img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=255}noiseCtx.putImageData(img,0,0)}
function render(){if(video.readyState>=2&&canvas.width){const w=canvas.width,h=canvas.height,amount=Number(strength.value)/100,p=presets[preset];ctx.save();ctx.filter=`saturate(${1+(p.sat-1)*amount}) contrast(${1+(p.contrast-1)*amount}) brightness(${1+(p.brightness-1)*amount})`;if(facing==='user'){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(video,0,0,w,h);ctx.restore();
if(amount>.01&&preset!=='clean'){ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.13*amount;ctx.drawImage(video,facing==='user'?-2*amount:2*amount,0,w,h);ctx.restore();ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.12*amount;ctx.fillStyle=p.tint;ctx.fillRect(0,0,w,h);ctx.restore()}
if(linesToggle.checked&&amount>.02){ctx.save();ctx.globalAlpha=.18*amount;ctx.fillStyle='#080808';const gap=Math.max(3,Math.round(h/240));for(let y=0;y<h;y+=gap)ctx.fillRect(0,y,w,Math.max(1,gap*.42));ctx.restore()}
if(noiseToggle.checked&&amount>.02){makeNoise();ctx.save();ctx.globalAlpha=.19*amount;ctx.globalCompositeOperation='soft-light';ctx.drawImage(noiseCanvas,0,0,w,h);ctx.restore()}
if(amount>.2&&preset!=='clean'){ctx.save();ctx.globalAlpha=.14*amount;ctx.fillStyle='#ff3e63';const y=(Date.now()/43)%h;ctx.fillRect(0,y,w,Math.max(1,h*.003));if(Math.random()<.018*amount){const gy=Math.random()*h;ctx.fillStyle='#e8f6ff';ctx.globalAlpha=.09;ctx.fillRect(0,gy,w,Math.max(1,h*.025))}ctx.restore()}
if(dateToggle.checked){ctx.save();const fontSize=Math.max(13,Math.round(w*.025));ctx.font=`500 ${fontSize}px monospace`;ctx.textAlign='left';ctx.textBaseline='bottom';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.lineWidth=Math.max(1,fontSize*.045);ctx.strokeStyle='#20150d';ctx.strokeText(dateText(),w*.045,h*.94);ctx.fillStyle='#ffbd79';ctx.fillText(dateText(),w*.045,h*.94);ctx.restore()}}
raf=requestAnimationFrame(render)}
function formatTime(ms){const s=Math.floor(ms/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`}
async function startRecording(){if(!stream){await startCamera();if(!stream)return}if(!canvas.captureStream||!window.MediaRecorder){toast('Este navegador no admite grabar el efecto. Prueba Safari actualizado.');return}try{const canvasStream=canvas.captureStream(30),audioTrack=stream.getAudioTracks()[0];if(audioTrack)canvasStream.addTrack(audioTrack);const mime=['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(canvasStream,mime?{mimeType:mime}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`VHS_E240_${Date.now()}.${blob.type.includes('mp4')?'mp4':'webm'}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Grabación terminada. Revisa Descargas o Archivos.')};recorder.start(250);recording=true;startedAt=Date.now();recordBtn.classList.add('recording');recBadge.classList.add('live');recordLabel.textContent='GRABANDO · PULSA PARA DETENER';statusText.textContent='CAM: RECORDING';timerHandle=setInterval(()=>timer.textContent=formatTime(Date.now()-startedAt),250)}catch(e){toast('No se pudo iniciar la grabación: '+e.message)}}
function stopRecording(){if(recorder&&recording){recorder.stop();recording=false;clearInterval(timerHandle);recordBtn.classList.remove('recording');recBadge.classList.remove('live');statusText.textContent='CAM: ACTIVE';recordLabel.textContent='PULSA PARA GRABAR'}}
startBtn.addEventListener('click',startCamera);recordBtn.addEventListener('click',()=>recording?stopRecording():startRecording());document.querySelector('#flipBtn').addEventListener('click',async()=>{facing=facing==='environment'?'user':'environment';await startCamera()});strength.addEventListener('input',()=>{strengthLabel.textContent=strength.value+'%'});document.querySelectorAll('.preset').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.preset').forEach(b=>b.classList.remove('active'));btn.classList.add('active');preset=btn.dataset.preset}));
document.querySelector('#snapshotBtn').addEventListener('click',()=>{if(!stream){toast('Enciende la cámara primero.');return}canvas.toBlob(blob=>{if(!blob){toast('No se pudo guardar la foto.');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`VHS_foto_${Date.now()}.jpg`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Fotograma guardado. Revisa Fotos o Archivos.')},'image/jpeg',.92)});document.querySelector('#galleryBtn').addEventListener('click',()=>toast('Las grabaciones se descargan en el dispositivo. Abre Fotos o Archivos para verlas.'));document.addEventListener('visibilitychange',()=>{if(document.hidden&&recording)stopRecording()});
})();
</script>
</body>
</html>
